<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1" />
  <title>今日彩票号码</title>
  <style>
    :root{--bg:#07101f;--card:#111a2e;--card2:#0b1324;--text:#f3f7ff;--muted:#91a3c7;--line:rgba(255,255,255,.10);--red:#f04455;--blue:#2279ff;--gold:#ffd166;--green:#52d273;--purple:#9b78ff}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{scroll-behavior:smooth}body{margin:0;background:linear-gradient(160deg,#060914 0%,#101b35 52%,#07111f 100%);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif;color:var(--text)}
    .app{max-width:760px;margin:0 auto;min-height:100vh;padding:14px 12px 88px}.top{position:sticky;top:0;z-index:9;margin:-14px -12px 12px;padding:14px 12px 10px;background:linear-gradient(180deg,rgba(7,16,31,.98),rgba(7,16,31,.88) 78%,rgba(7,16,31,0));backdrop-filter:blur(14px)}
    .hero{border:1px solid var(--line);border-radius:22px;padding:15px 14px;background:radial-gradient(circle at 12% 0%,rgba(240,68,85,.28),transparent 35%),radial-gradient(circle at 92% 0%,rgba(34,121,255,.22),transparent 42%),rgba(17,26,46,.92);box-shadow:0 16px 42px rgba(0,0,0,.28)}
    .hero-row{display:flex;align-items:center;justify-content:space-between;gap:10px}.title{font-size:24px;font-weight:950;letter-spacing:.2px}.date{font-size:12px;color:#06101e;background:var(--gold);border-radius:999px;padding:6px 9px;font-weight:900;white-space:nowrap}.sub{margin-top:8px;font-size:13px;color:#c6d4ef;line-height:1.55}.risk{margin-top:8px;padding:8px 10px;border-radius:13px;background:rgba(255,209,102,.10);border:1px solid rgba(255,209,102,.22);color:#ffe5a6;font-size:12px;line-height:1.45}
    .menu{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}.menu button,.chip{border:1px solid var(--line);border-radius:15px;background:#0c1528;color:#cfe0ff;padding:10px 6px;font-weight:900;font-size:14px}.menu button.active,.chip.active{background:linear-gradient(135deg,rgba(240,68,85,.34),rgba(34,121,255,.27));border-color:rgba(255,255,255,.25);color:#fff}.chipbar{display:flex;gap:8px;overflow-x:auto;padding:2px 0 11px;margin-bottom:2px;scrollbar-width:none}.chipbar::-webkit-scrollbar{display:none}.chip{flex:0 0 auto;min-width:84px}.chip small{display:block;color:var(--muted);font-weight:700;font-size:11px;margin-top:3px}
    .card{border:1px solid var(--line);border-radius:24px;background:rgba(17,26,46,.92);padding:15px;margin:12px 0;box-shadow:0 12px 28px rgba(0,0,0,.18)}.game-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:6px}.game-name{font-size:22px;font-weight:950}.money{color:#06101e;background:var(--green);border-radius:999px;padding:6px 9px;font-weight:950;font-size:12px;white-space:nowrap}.meta{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0 6px}.pill{border:1px solid var(--line);background:#0b1324;border-radius:999px;padding:6px 9px;font-size:12px;color:#b9c8e8}.pill b{color:#fff}.play-name{font-size:15px;color:#dfe9ff;font-weight:900;margin:12px 0 8px}.ticket{padding:13px;border-radius:19px;background:var(--card2);border:1px solid var(--line);margin:10px 0}.ticket-title{display:flex;justify-content:space-between;align-items:center;gap:10px;color:#d5e2fb;font-weight:900;font-size:14px;margin-bottom:9px}.tag{font-size:11px;color:var(--muted);font-weight:800}.label{font-size:12px;color:#9fb0d0;margin:7px 0 6px;font-weight:900}.balls{display:flex;gap:7px;flex-wrap:wrap}.ball{width:39px;height:39px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:950;font-size:15px;box-shadow:inset 0 -5px 9px rgba(0,0,0,.22),0 7px 15px rgba(0,0,0,.25)}.red{background:linear-gradient(#ff7984,#dc2539)}.blue{background:linear-gradient(#73acff,#1768e8)}.gold{background:linear-gradient(#ffe59a,#d99a00);color:#111}.purple{background:linear-gradient(#c8abff,#7447dc)}.divider{height:1px;background:var(--line);margin:10px 0}.rule{padding:10px 11px;border-radius:14px;background:#10182d;border:1px solid var(--line);margin:8px 0;color:#dce7ff;font-size:14px;line-height:1.55}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}.btn{border:0;border-radius:16px;padding:13px 10px;font-weight:950;background:var(--gold);color:#07101f}.btn.secondary{background:#17223a;color:#dce7ff;border:1px solid var(--line)}
    .panel{display:none}.panel.active{display:block}.quick{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.quick-card{border:1px solid var(--line);border-radius:18px;background:#0b1324;padding:12px}.quick-card b{display:block;font-size:16px;margin-bottom:5px}.quick-card span{color:var(--muted);font-size:12px}.mini-balls{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}.mini-ball{width:25px;height:25px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:950}.detail{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}.detail summary{color:#cfe0ff;font-weight:900}.detail p{font-size:13px;color:var(--muted);line-height:1.7;margin:9px 0 0}.footer{font-size:12px;color:var(--muted);text-align:center;line-height:1.7;margin-top:16px}
    .bottom-nav{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);z-index:20;width:min(740px,calc(100vw - 20px));display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:7px;border:1px solid rgba(255,255,255,.12);border-radius:22px;background:rgba(8,14,27,.88);backdrop-filter:blur(18px);box-shadow:0 14px 38px rgba(0,0,0,.38)}.bottom-nav button{border:0;border-radius:16px;background:transparent;color:#93a6c8;padding:8px 4px;font-weight:950}.bottom-nav button.active{background:#18233c;color:#fff}.empty{padding:24px;text-align:center;color:var(--muted)}
    @media(max-width:430px){.app{padding-left:10px;padding-right:10px}.top{margin-left:-10px;margin-right:-10px;padding-left:10px;padding-right:10px}.title{font-size:22px}.ball{width:37px;height:37px}.actions{grid-template-columns:1fr}.quick{grid-template-columns:1fr}.menu button{font-size:13px;padding:9px 4px}}
  </style>
</head>
<body>
<div class="app">
  <div class="top">
    <section class="hero">
      <div class="hero-row"><div class="title">今日彩票号码</div><div class="date" id="dateBadge">--</div></div>
      <div class="sub">只放今天要买的号码。红蓝球按之前的球形显示，其他说明收起来，不再一页到底。</div>
      <div class="risk">提醒：彩票随机，固定预算娱乐，不倍投。</div>
    </section>
    <nav class="menu" id="topMenu"></nav>
  </div>

  <div class="chipbar" id="gameChips"></div>

  <main id="main"><div class="empty">正在读取今日号码...</div></main>

  <section class="card panel" id="allPanel">
    <div class="game-head"><div><div class="game-name">全部号码</div><div class="sub">精简版，方便到店核对。</div></div></div>
    <div id="quickList" class="quick"></div>
    <div class="actions"><button class="btn" onclick="copyAllPlans()">复制全部</button><button class="btn secondary" onclick="switchMenu('ssq')">回双色球</button></div>
  </section>

  <div class="footer">不展示预测软件话术，只做今日固定号码和预算提醒。</div>
</div>

<nav class="bottom-nav" id="bottomNav"></nav>

<script>
let data=null;
let currentMenu='ssq';
let currentGameId='ssq';
const menus=[
  {id:'ssq',label:'双色球',games:['ssq']},
  {id:'dlt',label:'大乐透',games:['dlt']},
  {id:'digit',label:'数字票',games:['fc3d','pl3','pl5','qxc']},
  {id:'more',label:'更多',games:['qlc','kl8','jczq','scratch']}
];
const pad=n=>String(n).padStart(2,'0');
const findGame=id=>data.games.find(g=>g.id===id);
const mainPlay=g=>(g.plays||[])[0]||{tickets:[]};
function ballHtml(nums,type,mini=false){return `<div class="${mini?'mini-balls':'balls'}">${(nums||[]).map(n=>`<span class="${mini?'mini-ball':'ball'} ${type}">${pad(n)}</span>`).join('')}</div>`}
function digitHtml(nums,mini=false){return `<div class="${mini?'mini-balls':'balls'}">${(nums||[]).map(n=>`<span class="${mini?'mini-ball':'ball'} gold">${n}</span>`).join('')}</div>`}
function ticketText(t){
  if(t.red) return `红球 ${t.red.map(pad).join(' ')} + 蓝球 ${t.blue.map(pad).join(' ')}`;
  if(t.front) return `前区 ${t.front.map(pad).join(' ')} + 后区 ${t.back.map(pad).join(' ')}`;
  if(t.nums) return `号码 ${t.nums.map(pad).join(' ')}`;
  if(t.digits) return `数字 ${t.digits.join('')}`;
  if(t.rules) return t.rules.map((r,i)=>`${i+1}. ${r}`).join('；');
  return '';
}
function renderNav(){
  const html=menus.map(m=>`<button class="${m.id===currentMenu?'active':''}" onclick="switchMenu('${m.id}')">${m.label}</button>`).join('');
  document.getElementById('topMenu').innerHTML=html;
  document.getElementById('bottomNav').innerHTML=html;
}
function switchMenu(id){
  currentMenu=id;
  const m=menus.find(x=>x.id===id)||menus[0];
  currentGameId=m.games[0];
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}
function switchGame(id){currentGameId=id;render();window.scrollTo({top:0,behavior:'smooth'});}
function renderChips(){
  const m=menus.find(x=>x.id===currentMenu)||menus[0];
  document.getElementById('gameChips').innerHTML=m.games.map(id=>{
    const g=findGame(id); if(!g) return '';
    return `<button class="chip ${id===currentGameId?'active':''}" onclick="switchGame('${id}')">${g.name}<small>${mainPlay(g).cost}</small></button>`;
  }).join('') + `<button class="chip" onclick="showAll()">全部<small>总览</small></button>`;
}
function renderTicket(t,i){
  let html=`<div class="ticket"><div class="ticket-title"><span>第${i+1}组</span><span class="tag">${t.score?'评分 '+Number(t.score).toFixed(1):'照单买'}</span></div>`;
  if(t.red){ html+=`<div class="label">红球</div>${ballHtml(t.red,'red')}<div class="divider"></div><div class="label">蓝球</div>${ballHtml(t.blue,'blue')}`; }
  else if(t.front){ html+=`<div class="label">前区</div>${ballHtml(t.front,'red')}<div class="divider"></div><div class="label">后区</div>${ballHtml(t.back,'blue')}`; }
  else if(t.nums){ html+=`<div class="label">号码</div>${ballHtml(t.nums,'purple')}`; }
  else if(t.digits){ html+=`<div class="label">数字</div>${digitHtml(t.digits)}<div class="label">和值 ${t.sum}｜跨度 ${t.span}</div>`; }
  else if(t.rules){ html+=t.rules.map((r,idx)=>`<div class="rule">${idx+1}. ${r}</div>`).join(''); }
  return html+'</div>';
}
function renderGame(){
  const g=findGame(currentGameId); if(!g) return '<div class="empty">暂无号码</div>';
  const p=mainPlay(g);
  return `<section class="card">
    <div class="game-head"><div><div class="game-name">${g.name}</div><div class="play-name">${p.name.replace(/：.*/,'')}</div></div><div class="money">${p.cost}</div></div>
    <div class="meta"><span class="pill">${g.group}</span><span class="pill"><b>${p.bets}</b></span><span class="pill">${g.frequency||'今日固定'}</span></div>
    ${(p.tickets||[]).map(renderTicket).join('')}
    <div class="actions"><button class="btn" onclick="copyPlan('${g.id}')">复制本项</button><button class="btn secondary" onclick="showAll()">看全部</button></div>
    <details class="detail"><summary>展开说明</summary><p>${g.desc||''}<br>${g.risk||data.notice}</p></details>
  </section>`;
}
function renderQuickCard(g){
  const p=mainPlay(g), t=(p.tickets||[])[0]||{};
  let balls='';
  if(t.red) balls=`${ballHtml(t.red,'red',true)}${ballHtml(t.blue,'blue',true)}`;
  if(t.front) balls=`${ballHtml(t.front,'red',true)}${ballHtml(t.back,'blue',true)}`;
  if(t.nums) balls=ballHtml(t.nums,'purple',true);
  if(t.digits) balls=digitHtml(t.digits,true);
  if(t.rules) balls='<span class="sub">纪律清单</span>';
  return `<div class="quick-card"><b>${g.name}</b><span>${p.cost}｜${p.bets}</span>${balls}<div class="sub" style="margin-top:8px">${(p.tickets||[]).map((x,i)=>`第${i+1}组：${ticketText(x)}`).join('<br>')}</div></div>`;
}
function showAll(){
  document.getElementById('main').innerHTML='';
  document.getElementById('allPanel').classList.add('active');
  renderNav(); renderChips(); renderQuickList(); window.scrollTo({top:0,behavior:'smooth'});
}
function renderQuickList(){
  const ids=['ssq','dlt','fc3d','pl3','pl5','qxc','qlc','kl8'];
  document.getElementById('quickList').innerHTML=ids.map(findGame).filter(Boolean).map(renderQuickCard).join('');
}
function render(){
  if(!data) return;
  document.getElementById('allPanel').classList.remove('active');
  document.getElementById('dateBadge').textContent=data.date;
  renderNav(); renderChips();
  document.getElementById('main').innerHTML=renderGame();
}
function copyPlan(id){
  const g=findGame(id||currentGameId), p=mainPlay(g);
  const txt=[`${g.name} ${data.date}`,`金额：${p.cost}｜${p.bets}`,...(p.tickets||[]).map((t,i)=>`第${i+1}组：${ticketText(t)}`),'提醒：固定预算，不倍投。'].join('\n');
  navigator.clipboard?.writeText(txt); alert('已复制');
}
function copyAllPlans(){
  const ids=['ssq','dlt','fc3d','pl3','pl5','qxc','qlc','kl8'];
  const lines=[`今日彩票号码 ${data.date}`];
  ids.map(findGame).filter(Boolean).forEach(g=>{const p=mainPlay(g);lines.push('',`${g.name}｜${p.cost}｜${p.bets}`);(p.tickets||[]).forEach((t,i)=>lines.push(`第${i+1}组：${ticketText(t)}`));});
  lines.push('', '提醒：固定预算娱乐，不倍投。');
  navigator.clipboard?.writeText(lines.join('\n')); alert('全部已复制');
}
fetch('data/all_daily_plans.json',{cache:'no-store'}).then(r=>r.json()).then(j=>{data=j;render();}).catch(e=>{document.getElementById('main').innerHTML='<div class="card">读取号码失败，请刷新。</div>';console.error(e);});
</script>
</body>
</html>
